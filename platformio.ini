[env:smalltv_esp8266]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
board_build.ldscript = eagle.flash.4m2m.ld

lib_deps =
  bodmer/TFT_eSPI @ ^2.5.43
  olikraus/U8g2_for_TFT_eSPI @ ^1.8.0
  bblanchon/ArduinoJson @ ^7.2.0
  ayushsharma82/ElegantOTA @ ^3.1.5

; Розпіновка дисплея ST7789 (240x240) для апаратної платформи GeekMagic SmallTV (ESP8266)
; Джерело розпіновки: https://giovi321.github.io/smalltv-mod/getting-started/hardware/
build_flags =
  -D USER_SETUP_LOADED=1
  -D ST7789_DRIVER=1
  -D TFT_WIDTH=240
  -D TFT_HEIGHT=240
  -D TFT_RGB_ORDER=TFT_RGB
  -D TFT_MOSI=13
  -D TFT_SCLK=14
  -D TFT_CS=15
  -D TFT_DC=0
  -D TFT_RST=2
  -D TFT_BL=5
  -D TFT_BACKLIGHT_ON=LOW
  -D TFT_SPI_MODE=SPI_MODE3
  -D SPI_FREQUENCY=40000000
  -D LOAD_GLCD=1
  -D LOAD_FONT2=1
  -D SMOOTH_FONT=1
